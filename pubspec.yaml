name: rent_and_play_app
description: "Rent and Play - Sports equipment and gaming console rentals app with Firebase and ESP32 integration."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Services
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.2.10
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.0
  google_sign_in: 6.2.1
  http: ^1.6.0

  # State Management
  provider: ^6.1.2

  # Features & Utilities
  mobile_scanner: 5.2.3
  image_picker: ^1.1.2
  intl: ^0.20.2
  pdf: ^3.13.1
  printing: ^5.15.1
  qr_flutter: ^4.1.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  firebase_core_platform_interface: ^6.0.3
  firebase_auth_platform_interface: ^7.7.3

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
